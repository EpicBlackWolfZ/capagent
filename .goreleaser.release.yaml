# Packaging only: release-check compiles and verifies all inputs first.
version: 2
project_name: capagent
dist: dist/package
builds:
  - id: packaging-only
    skip: true

archives:
  - id: capagent-linux-amd64
    meta: true
    name_template: "capagent_{{ .Version }}_linux_amd64"
    formats:
      - tar.gz
    files:
      - src: dist/fat/minimal/amd64/capagent
        dst: .
        strip_parent: true
      - README.md
      - LICENSE
      - docs/*

  - id: capagent-linux-arm64
    meta: true
    name_template: "capagent_{{ .Version }}_linux_arm64"
    formats:
      - tar.gz
    files:
      - src: dist/fat/minimal/arm64/capagent
        dst: .
        strip_parent: true
      - README.md
      - LICENSE
      - docs/*

sboms:
  - id: spdx
    artifacts: archive
    documents:
      - "${artifact}.spdx.json"
    args: ["$artifact", "--output", "spdx-json=$document"]
  - id: cyclonedx
    artifacts: archive
    documents:
      - "${artifact}.cyclonedx.json"
    args: ["$artifact", "--output", "cyclonedx-json=$document"]

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-SNAPSHOT-{{ .ShortCommit }}"

release:
  github:
    owner: EpicBlackWolfZ
    name: capagent

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
