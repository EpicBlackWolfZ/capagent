# GoReleaser configuration for capagent
# Multi-microarchitecture universal fat binary builds via microfat
version: 2

project_name: capagent

builds:
  - id: capagent-amd64
    main: ./cmd/capagent
    binary: capagent
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
    goamd64:
      - v1
      - v2
      - v3
      - v4
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/EpicBlackWolfZ/capagent/internal/version.Version={{.Version}}
      - -X github.com/EpicBlackWolfZ/capagent/internal/version.Commit={{.Commit}}
      - -X github.com/EpicBlackWolfZ/capagent/internal/version.Date={{.Date}}
      - -X github.com/EpicBlackWolfZ/capagent/internal/version.BuiltBy=goreleaser
      - -X github.com/EpicBlackWolfZ/capagent/internal/version.Vendor=EpicBlackWolfZ
      - -X github.com/EpicBlackWolfZ/capagent/internal/version.OS={{.Os}}
      - -X github.com/EpicBlackWolfZ/capagent/internal/version.Arch={{.Arch}}

  - id: capagent-arm64
    main: ./cmd/capagent
    binary: capagent
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - arm64
    goarm64:
      - v8.0
      - v8.2
      - v9.0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/EpicBlackWolfZ/capagent/internal/version.Version={{.Version}}
      - -X github.com/EpicBlackWolfZ/capagent/internal/version.Commit={{.Commit}}
      - -X github.com/EpicBlackWolfZ/capagent/internal/version.Date={{.Date}}
      - -X github.com/EpicBlackWolfZ/capagent/internal/version.BuiltBy=goreleaser
      - -X github.com/EpicBlackWolfZ/capagent/internal/version.Vendor=EpicBlackWolfZ
      - -X github.com/EpicBlackWolfZ/capagent/internal/version.OS={{.Os}}
      - -X github.com/EpicBlackWolfZ/capagent/internal/version.Arch={{.Arch}}

snapshot:
  version_template: "{{ incpatch .Version }}-SNAPSHOT-{{ .ShortCommit }}"
