name: Set up pinned build tools
description: Explicit tools for lint, release packaging, or the complete tag gate.
inputs:
  profile:
    description: lint, build, or full
    required: true
runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.27.1'
        cache: false
    - name: Install golangci-lint
      if: inputs.profile == 'lint' || inputs.profile == 'full'
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: v2.13.2
        install-only: true
        skip-cache: true
    - name: Install GoReleaser
      if: inputs.profile == 'build' || inputs.profile == 'full'
      uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
      with:
        distribution: goreleaser
        version: v2.18.0
        install-only: true
    - name: Install Syft
      if: inputs.profile == 'build' || inputs.profile == 'full'
      uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      with:
        syft-version: v1.51.1
    - name: Install full gate scanners
      if: inputs.profile == 'full'
      shell: bash
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
        go install github.com/zricethezav/gitleaks/v8@v8.30.1
    - name: Install script and workflow validators
      if: inputs.profile == 'lint' || inputs.profile == 'full'
      shell: bash
      run: |
        go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
        ./scripts/install-shellcheck.sh
        echo "$PWD/bin/dev-tools" >> "$GITHUB_PATH"
    - name: Check profile and build prerequisites
      shell: bash
      env:
        TOOL_PROFILE: ${{ inputs.profile }}
      run: |
        case "$TOOL_PROFILE" in lint|build|full) ;; *) exit 1 ;; esac
        python3 --version
        go version
