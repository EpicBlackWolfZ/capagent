name: CI
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE*', '.gitignore']
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pr-lint:
    name: Validate Conventional PR Title
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    steps:
      - name: Check conventional title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          profile: lint
      - name: Run shared lint verification
        run: python3 -B scripts/gate.py stage --stage lint
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: m1.1-lint-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          path: .work/gate/
          retention-days: 14
  test:
    name: Unit Tests & Coverage Gate (>= 95%)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
      - name: Run shared test verification
        run: python3 -B scripts/gate.py stage --stage test
      - name: Verify passive Podman discovery as user and root
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends podman strace
          mkdir -p .work/gate/podman
          CGO_ENABLED=0 go build -o .work/gate/podman/capagent ./cmd/capagent
          dpkg-query -W podman > .work/gate/podman/package.txt
          python3 -B scripts/podman-discovery-smoke.py --binary .work/gate/podman/capagent --output .work/gate/podman/user
          python3 -B scripts/podman-discovery-smoke.py --binary .work/gate/podman/capagent --output .work/gate/podman/root --sudo
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: m1.1-test-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          path: .work/gate/
          retention-days: 14
  vulncheck:
    name: Vulnerability Scan (govulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Run shared vulncheck verification
        run: python3 -B scripts/gate.py stage --stage vulncheck
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: m1.1-vulncheck-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          path: .work/gate/
          retention-days: 14
  gitleaks:
    name: Secrets Detection (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Run shared gitleaks verification
        run: python3 -B scripts/gate.py stage --stage gitleaks
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: m1.1-gitleaks-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          path: .work/gate/
          retention-days: 14
  build:
    name: Build, GoReleaser Snapshot & Self-Bundling Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          profile: build
      - name: Run shared build verification
        run: python3 -B scripts/gate.py stage --stage build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: m1.1-build-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          path: .work/gate/
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: release-rehearsal-${{ github.run_attempt }}
          path: |
            dist/release-inputs.tar.gz
            dist/verify-*.json
            dist/verified-*.json
          retention-days: 14
  fuzz:
    name: Bounded Fuzz Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
      - name: Run shared fuzz verification
        run: python3 -B scripts/gate.py stage --stage fuzz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: m1.1-fuzz-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          path: .work/gate/
          retention-days: 14
  hardening-gate:
    name: M1.1 Hardening Gate
    needs: [lint, test, vulncheck, gitleaks, build, fuzz]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: always()
        with:
          pattern: m1.1-*-${{ github.run_attempt }}
          merge-multiple: true
          path: .work/gate/
      - name: Require complete evidence from this source and workflow attempt
        if: always()
        env:
          CAPAGENT_JOB_RESULTS: >-
            {"lint":"${{ needs.lint.result }}","test":"${{ needs.test.result }}","vulncheck":"${{ needs.vulncheck.result }}","gitleaks":"${{ needs.gitleaks.result }}","build":"${{ needs.build.result }}","fuzz":"${{ needs.fuzz.result }}"}
        run: python3 -B scripts/gate.py report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: m1.1-gate-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .work/gate/summary.json
            .work/gate/summary.md
          retention-days: 14
