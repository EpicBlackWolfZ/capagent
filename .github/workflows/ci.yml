name: CI
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE*', '.gitignore']
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pr-lint:
    name: Validate Conventional PR Title
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    steps:
      - name: Check conventional title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          profile: lint
      - run: make check-mod lint build-contracts
  test:
    name: Unit Tests & Coverage Gate (>= 95%)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
      - run: go install gotest.tools/gotestsum@v1.13.0
      - name: Race tests and exact coverage gates
        id: unit-tests
        run: |
          mkdir -p .work/hardening/ci
          gotestsum --junitfile junit.xml --jsonfile .work/hardening/ci/events.jsonl --format pkgname -- -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...
          python3 -B scripts/check-coverage.py coverage.out 95.0 | tee coverage-summary.txt
          cat coverage-summary.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Verify hardening evidence from the same test run
        if: always()
        env:
          TEST_EXIT: ${{ steps.unit-tests.outcome == 'success' && '0' || '1' }}
        run: python3 -B scripts/hardening.py report --events .work/hardening/ci/events.jsonl --output .work/hardening/ci --test-exit "$TEST_EXIT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-results-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            junit.xml
            coverage.out
            coverage-summary.txt
            .work/hardening/ci/events.jsonl
            .work/hardening/ci/summary.json
          retention-days: 14
  vulncheck:
    name: Vulnerability Scan (govulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - run: make vuln
  gitleaks:
    name: Secrets Detection (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - run: gitleaks git --redact --no-banner
  build:
    name: Build, GoReleaser Snapshot & Self-Bundling Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          profile: build
      - name: Rehearse minimal release without publishing
        run: make release-check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: release-rehearsal-${{ github.run_attempt }}
          path: |
            dist/release-inputs.tar.gz
            dist/verify-*.json
            dist/verified-*.json
          retention-days: 14
